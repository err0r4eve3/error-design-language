name: Full browser QA

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-browser-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  full:
    name: Full registered QA and file-mode smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: error-design-language
    steps:
      - name: Check out tested revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: error-design-language
          persist-credentials: false
      - name: Initialize evidence and tooling paths
        run: |
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/edl-browser-tools/node_modules/playwright" >> "$GITHUB_ENV"
          echo "EVIDENCE_ROOT=$RUNNER_TEMP/edl-full-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - name: Record tested source
        run: |
          mkdir -p "$EVIDENCE_ROOT"
          git rev-parse HEAD > "$EVIDENCE_ROOT/source-commit.txt"
          git archive --format=tar.gz HEAD -o "$EVIDENCE_ROOT/source.tar.gz"
      - name: Use the reproducible Node baseline
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: error-design-language/.nvmrc
          package-manager-cache: false
      - name: Install isolated pinned browser tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/edl-browser-tools" --no-audit --no-fund --package-lock=false playwright@1.56.0
          "$RUNNER_TEMP/edl-browser-tools/node_modules/.bin/playwright" install --with-deps chromium
      - name: Run every registered suite in inline mode
        run: node tests/run.cjs --suite all --mode inline --out "$EVIDENCE_ROOT/inline"
      - name: Check supported file-mode entries
        if: ${{ !cancelled() }}
        run: node tests/run.cjs --suite preview,patterns,regions --mode file --out "$EVIDENCE_ROOT/file"
      - name: Validate coverage definitions
        if: ${{ !cancelled() }}
        run: node evals/coverage.cjs
      - name: Preserve source, reports, logs and screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: full-qa-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE_ROOT }}/
          if-no-files-found: warn
          retention-days: 7
